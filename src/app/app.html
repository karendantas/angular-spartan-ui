<div class="min-h-screen bg-background text-foreground font-sans selection:bg-primary/30">
  <header
    class="sticky top-0 z-10 backdrop-blur-md bg-background/80 border-b border-border shadow-sm"
  >
    <div class="container mx-auto px-4 py-4">
      <h1 class="text-2xl font-black tracking-tight flex items-center gap-2">
        <span>🥗</span>
        <span class="text-green-600"> Karen e Mirla Receitas </span>
      </h1>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8 max-w-6xl">
    @if (!selectedRecipe()) {
      <app-recipe-list [recipes]="allRecipes()" (selectRecipe)="onRecipeSelected($event)" />
    } @else {
      <app-recipe-detail [recipe]="selectedRecipe()!" (goBack)="clearSelection()" />
    }
  </main>
</div>
