<!-- Barra de Busca -->
<div class="mb-8">
  <input
    type="text"
    placeholder="Buscar receita ou categoria..."
    class="w-full max-w-md p-3 rounded-lg border border-input bg-background text-foreground focus:outline-none focus:ring-2 focus:ring-ring transition-all"
    (input)="updateSearch($event)"
  />
</div>

<!-- Grid de Receitas -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  @for (recipe of filteredRecipes(); track recipe.id) {
    <div
      (click)="onSelect(recipe)"
      class="group cursor-pointer border border-border rounded-xl overflow-hidden bg-card hover:border-primary transition-all duration-300 shadow-sm hover:shadow-md"
    >
      <div class="relative h-48 overflow-hidden">
        <img
          [src]="recipe.image"
          [alt]="recipe.title"
          class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
        />
        <span
          class="absolute top-3 right-3 bg-background/90 backdrop-blur-sm text-foreground text-xs px-2.5 py-1 rounded-md font-semibold border border-border/50"
        >
          {{ recipe.category }}
        </span>
      </div>
      <div class="p-5">
        <h3
          class="text-xl font-bold text-card-foreground group-hover:text-primary transition-colors"
        >
          {{ recipe.title }}
        </h3>
      </div>
    </div>
  } @empty {
    <div
      class="col-span-full text-center py-16 text-muted-foreground bg-secondary/20 rounded-xl border border-dashed border-border"
    >
      Nenhuma receita encontrada para "{{ searchTerm() }}".
    </div>
  }
</div>
